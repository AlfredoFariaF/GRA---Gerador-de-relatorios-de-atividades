services:
  mysql:
    image: mysql:8.4
    container_name: gra_laravel_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: GRA_Project
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: gra_user
      MYSQL_PASSWORD: admin123

    ports:
      - "3306:3306"

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: